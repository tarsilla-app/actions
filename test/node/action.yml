name: NodeJS Publish
description: Publish a new release to NPM when a new tag is created on the repository.
inputs:
  config:
    required: true
  node-version:
    required: false
    default: '26.x'
runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: https://registry.npmjs.org

    - name: Install
      shell: bash
      run: ${{ fromJson(inputs.config).install || 'npm ci' }}

    - name: Test
      shell: bash
      run: ${{ fromJson(inputs.config).test || 'npm run test' }}