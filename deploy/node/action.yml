name: NodeJS Deploy
description: Deploys a NodeJS application, currently supporting Storybook and Vite deployment to GitHub Pages.
inputs:
  config:
    required: true
  node-version:
    required: false
    default: '25.x'
outputs:
  github_pages_url:
    value: ${{ steps.github-pages.outputs.github_pages_url }}
runs:
  using: composite
  steps:
    - id: validate-config
      run: |
        node -e "
        let config;
        try {
          config = JSON.parse(process.env.CONFIG);
        } catch (e) {
          console.error('Invalid JSON in inputs.config:', process.env.CONFIG);
          console.error('Error:', e.message);
          process.exit(1);
        }
        const hosts = ['github-pages'].filter((h) => config[h] && config[h].type);
        if (hosts.length > 1) {
          console.error('Only one deploy host may be configured, but found:', hosts.join(', '));
          process.exit(1);
        }"
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}

    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: https://registry.npmjs.org

    - id: github-pages
      if: ${{ fromJson(inputs.config)['github-pages'] && fromJson(inputs.config)['github-pages'].type }}
      uses: tarsilla-app/actions/deploy/node/github-pages@main
      with:
        type: ${{ fromJson(inputs.config)['github-pages'].type }}
        install: ${{ fromJson(inputs.config)['github-pages'].install }}
        build: ${{ fromJson(inputs.config)['github-pages'].build }}
        path: ${{ fromJson(inputs.config)['github-pages'].path }}
